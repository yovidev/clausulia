server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Límite real de tamaño: nginx corta con 413 antes de que la petición llegue a la API.
    # 21m deja margen sobre los 20 MB del PDF para las cabeceras del multipart.
    client_max_body_size 21m;

    # /ask puede tardar (LLM con reintentos): timeout de proxy de 60 s.
    location = /api/ask {
        proxy_pass http://api:8000/ask;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # El resto de /api/*: la barra final de proxy_pass quita el prefijo /api.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # SPA: cualquier otra ruta sirve index.html.
    location / {
        try_files $uri /index.html;
    }
}
